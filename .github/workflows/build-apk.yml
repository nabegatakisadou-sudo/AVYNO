name: Build APK
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Alamat backend https://... (boleh kosong dulu)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cari dan siapkan proyek
        run: |
          shopt -s nullglob
          for z in *.zip; do unzip -qo "$z"; done
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)")
          echo "Proyek ditemukan di: $DIR"
          echo "ANDROID_DIR=$DIR" >> "$GITHUB_ENV"
      - name: Simpan folder backend ke repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add aivideo/backend
          git commit -m "Ekstrak backend" || echo "tidak ada perubahan"
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Setujui lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        run: gradle -p "$ANDROID_DIR" assembleDebug --no-daemon
        env:
          BASE_URL: ${{ inputs.base_url }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: AIVideoEditor-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
